name: 真实项目任务反馈
description: 在真实项目上完成/失败一次任务（用于 O4，禁止贴项目机密）
title: "[Task]: "
labels: [task-feedback, feedback]
body:
  - type: markdown
    attributes:
      value: |
        用于统计「外部用户真实任务」证据。**不要**粘贴业务源码、客户数据、API Key、Session JSON。
        指南：`docs/外部用户反馈指南.md`。

  - type: checkboxes
    id: no_secrets
    attributes:
      label: 我已确认
      options:
        - label: 不含 Key、.env、Session、客户数据与未脱敏绝对路径
          required: true
        - label: 任务描述已脱敏（可用「内部后台登录页」代替真实产品名）
          required: true

  - type: input
    id: version
    attributes:
      label: MAO 版本
      placeholder: MAO 0.1.0b7
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options: [Windows, Ubuntu/Linux, macOS, Other]
    validations:
      required: true

  - type: dropdown
    id: entry
    attributes:
      label: 入口
      options: [mao 终端对话, mao web, mao run, 其他]
    validations:
      required: true

  - type: dropdown
    id: permission_mode
    attributes:
      label: 权限模式
      options: [approve, readonly, auto, 不确定]
    validations:
      required: true

  - type: dropdown
    id: task_type
    attributes:
      label: 任务类型（自估）
      options:
        - 只读解释 / 问答
        - 诊断排错
        - 小范围修改
        - 构建 / 新功能
        - 审查
        - 其他
    validations:
      required: true

  - type: dropdown
    id: outcome
    attributes:
      label: 结果
      options:
        - 完成且可接受
        - 部分完成
        - 失败 / blocked
        - 中途放弃
    validations:
      required: true

  - type: input
    id: provider_family
    attributes:
      label: Provider 族（不要写 Key）
      description: 例如 Anthropic 官方 / 火山 Coding Plan / OpenAI 兼容 / 本地 Ollama
      placeholder: 火山 Coding Plan
    validations:
      required: true

  - type: input
    id: model_alias
    attributes:
      label: 主模型别名（配置里的名字，非密钥）
      placeholder: glm-ark / claude-sonnet-5

  - type: textarea
    id: task_summary
    attributes:
      label: 脱敏任务摘要
      description: 1～3 句说明你想做什么，避免公司/客户真名与机密路径。
      placeholder: 在本地前端仓库只读检查路由与登录相关文件结构，不要求改代码。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 可公开证据（脱敏）
      description: |
        可写：是否调用了工具、大致工具次数、是否写入项目、错误码、是否需手动修复。
        不要贴：完整 diff、客户接口、密钥、Session 文件。
      placeholder: |
        - 工具：read_file 若干次，无 write_file
        - 结果：给出了目录结构说明
        - 错误码：无
        - 是否误改文件：否

  - type: dropdown
    id: would_reuse
    attributes:
      label: 是否会再次使用 MAO
      options: [会, 不确定, 不会]
    validations:
      required: true

  - type: textarea
    id: friction
    attributes:
      label: 最大摩擦点（可选）
      description: 安装、配 Key、权限确认、速度、中文理解、误改风险等
