name: Bug report
description: 可复现的产品缺陷（禁止粘贴 Key / Session）
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste** API keys, `.env`, session files, or private project source.
        Guide: `docs/外部用户反馈指南.md`. Sanitize logs with `python scripts/sanitize_feedback_text.py`.

  - type: checkboxes
    id: no_secrets
    attributes:
      label: Confirmation
      options:
        - label: This report has no API keys, Bearer tokens, full .env, or session dumps
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands or UI steps with all keys removed.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MAO version
      placeholder: MAO 0.1.0b7
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Ubuntu/Linux, macOS, Other]
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.11.9

  - type: dropdown
    id: permission_mode
    attributes:
      label: Permission mode
      options: [approve, readonly, auto, n/a]
    validations:
      required: true

  - type: input
    id: error_code
    attributes:
      label: Stable error code (if any)
      description: e.g. authentication_error, invalid_request_error, connection_error
      placeholder: invalid_request_error

  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      description: Never include API keys, private prompts, or session contents.
      render: shell
